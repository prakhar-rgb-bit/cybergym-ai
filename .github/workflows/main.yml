name: Build CyberGym APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q cybergym-ai.zip -d project

          echo "=== Project structure ==="
          find project -maxdepth 4 -type f | head -100

          echo "=== Finding Gradle wrapper ==="
          find project -name gradlew -type f

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Find project and build APK
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            echo "The ZIP may not contain a complete Android Studio/Gradle project."
            exit 1
          fi

          echo "Found Gradle wrapper:"
          echo "$GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo "Building APK..."
          ./gradlew assembleDebug --stacktrace

      - name: Find generated APK
        run: |
          echo "=== APK files ==="
          find project -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberGym-APK
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
