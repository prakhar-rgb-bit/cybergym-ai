name: Build CyberGym APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract CyberGym project
        run: |
          mkdir project
          unzip -q cybergym-ai.zip -d project

          echo "=== Project files ==="
          find project -maxdepth 3 -type f | sort

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        run: |
          cd project

          echo "=== Gradle version ==="
          gradle --version

          echo "=== Building APK ==="
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "=== Generated APK ==="
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberGym-APK
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
